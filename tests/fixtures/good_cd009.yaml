services:
  db:
    image: postgres:16.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
  migrate:
    image: app:1.0
    depends_on:
      db:
        condition: service_healthy
  app:
    image: app:1.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  no_healthcheck_dependency:
    image: app:1.0
    depends_on:
      - plain
  plain:
    image: plain:1.0

services:
  db:
    image: postgres:16.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
  short:
    image: app:1.0
    depends_on:
      - db # expect: CD009
  long_started:
    image: app:1.0
    depends_on:
      db:
        condition: service_started # expect: CD009
  long_default:
    image: app:1.0
    depends_on:
      db: # expect: CD009
        restart: true

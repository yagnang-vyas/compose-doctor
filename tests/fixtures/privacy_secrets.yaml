# Fake secrets for the privacy test: none of these values may appear in any output.
services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: fake-pass-123
      POSTGRES_USER: fake-user-abc
  worker:
    image: worker:1.0
    environment:
      - API_TOKEN=fake-token-xyz
      - 12345
    ports:
      - "fake-port-entry"

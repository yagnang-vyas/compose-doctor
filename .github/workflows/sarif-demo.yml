# Uploads Compose Doctor findings for the deliberately insecure example to GitHub code scanning.
# Manual only, so the example does not create permanent alerts on every push.
name: SARIF demo

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Compose Doctor
        run: pip install .
      - name: Lint the insecure example
        run: >
          compose-doctor examples/insecure/compose.yaml
          --format sarif --fail-on never > compose-doctor.sarif
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compose-doctor.sarif
          category: compose-doctor

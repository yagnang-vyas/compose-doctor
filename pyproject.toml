[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compose-doctor"
dynamic = ["version"]
description = "Lint Docker Compose files for security, misconfiguration and reliability problems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yagnang Vyas" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["docker", "docker-compose", "linter", "security", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
compose-doctor = "compose_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/yagnang-vyas/compose-doctor"
Issues = "https://github.com/yagnang-vyas/compose-doctor/issues"

[tool.hatch.version]
path = "src/compose_doctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/compose_doctor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["compose_doctor"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
